[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oct7-tokenmeter"
version = "0.6.0"
description = "Live local meter for Claude Code, Codex, and OpenCode sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Oct7"}]
keywords = ["ai-agents", "claude-code", "codex", "opencode", "token-usage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "PyYAML>=6.0",
  "PyQt6>=6.6",
  "watchdog>=4.0",
]

[project.urls]
Homepage = "https://github.com/Oct7/tokenmeter"
Repository = "https://github.com/Oct7/tokenmeter"
Issues = "https://github.com/Oct7/tokenmeter/issues"

[project.scripts]
tokenmeter = "tokenmeter.cli:main"

[tool.setuptools.packages.find]
include = ["tokenmeter*"]

[tool.setuptools.package-data]
tokenmeter = ["services.yaml"]
